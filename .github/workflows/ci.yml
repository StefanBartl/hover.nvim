name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua/ plugin/ TESTS/ scripts/

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua plugin

  # Both platforms, because REL-19 asks for both and only one of them was
  # ever automated. The parts that differ are real: path separators, `tempname()`,
  # and the file-mode question that broke the very first run here (a `.sh`
  # committed 100644 out of a Windows checkout). Everything below is invoked as
  # `bash scripts/test.sh` rather than `scripts/test.sh` for that last reason --
  # it does not depend on an executable bit that a Windows filesystem does not
  # have.
  #
  # Not covered on either runner, and not pretended to be: the previews that
  # need a terminal -- drawing images, rasterizing a PDF, converting an office
  # document. Those have no CI anywhere and are evidenced only by hand.
  tests:
    name: plenary specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # All three are resolved by scripts/minimal_init.lua from .deps/ -- see
      # the three lookup paths it documents. lib.nvim is a hard dependency, so
      # a run without it is not a degraded run, it is no run at all. ui.nvim
      # is optional in the plugin itself, but TESTS/status_view_spec.lua
      # asserts the dashboard board actually opens, so the suite needs it too.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/ui.nvim
          path: .deps/ui.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # The crop check needs images.nvim and the ImageMagick it runs, neither of
      # which a runner has, so it reports pending here by design. The runner
      # still prints and names every pending spec -- this only stops it from
      # failing the build over the one that is expected.
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh
        env:
          HOVER_ALLOW_PENDING: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # See lib.nvim's own templates/README.md ("Pinning lib.nvim in CI") for why:
  # ci-verified only moves once stylua+luacheck+tests are green here, so this
  # repo's own consumers (currently markdown.nvim) can pin ref: ci-verified
  # instead of main and never see a red build that's actually this repo's WIP.
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards: two pushes can finish out of order,
      # and the older run must not overwrite the newer verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
          if [ -z "$tip" ]; then
            # First publish. A plain push creates the branch and is rejected if a
            # concurrent run created it first.
            git push origin HEAD:refs/heads/ci-verified
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
          case "$status" in
            behind | identical)
              echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
              ;;
            ahead | diverged)
              # The lease makes the server refuse the update if ci-verified moved since
              # the comparison, so an older run can never overwrite a newer one.
              git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip"
              ;;
            *)
              echo "::error::unexpected compare status '$status' for $tip...$SHA"
              exit 1
              ;;
          esac
