name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ TESTS/ scripts/

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua plugin

  # Both platforms, because REL-19 asks for both and only one of them was
  # ever automated. The parts that differ are real: path separators, `tempname()`,
  # and the file-mode question that broke the very first run here (a `.sh`
  # committed 100644 out of a Windows checkout). Everything below is invoked as
  # `bash scripts/test.sh` rather than `scripts/test.sh` for that last reason --
  # it does not depend on an executable bit that a Windows filesystem does not
  # have.
  #
  # Not covered on either runner, and not pretended to be: the previews that
  # need a terminal -- drawing images, rasterizing a PDF, converting an office
  # document. Those have no CI anywhere and are evidenced only by hand.
  tests:
    name: plenary specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: which of the two broke
      # is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Both are resolved by scripts/minimal_init.lua from .deps/ -- see the
      # three lookup paths it documents. lib.nvim is a hard dependency, so a
      # run without it is not a degraded run, it is no run at all.
      - uses: actions/checkout@v4
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
      - uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: .deps/plenary.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # The crop check needs images.nvim and the ImageMagick it runs, neither of
      # which a runner has, so it reports pending here by design. The runner
      # still prints and names every pending spec -- this only stops it from
      # failing the build over the one that is expected.
      - run: bash scripts/test.sh
        env:
          HOVER_ALLOW_PENDING: "1"
